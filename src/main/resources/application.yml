spring:
  application:
    name: food-delivery
  threads:
    virtual:
      enabled: true

fooddelivery:
  store: memory                     # memory (one process) or aws (DynamoDB + SNS + SQS)
  roles: [api, relay, restaurant, dispatch]
  couriers: 20
  max-receive-count: 3              # deliveries before a message goes to the dead-letter queue
  visibility-seconds: 5             # how long a received message stays hidden before redelivery
  poll-ms: 250
  aws:
    endpoint: ""                    # e.g. http://localhost:5000 for Moto; empty = real AWS
    region: us-east-1
    prefix: fooddelivery

management:
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness and /readiness for Kubernetes
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: false              # on in the docker profile (Jaeger)
